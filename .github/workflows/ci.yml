# Runs the whole check (`npm run check -- --all`: build, made tables, the repo's rules, every test) on every push and
# pull request, on Linux; and on macOS the check of the areas whose tests differ there: a plan writer's read-only mount,
# made with `sandbox-exec` (plan_sandbox, its real_programs_ test refuses a write into the guarded folders for real;
# plan_steps, macOS's own words when it cannot be made), a process's state read with `ps` (detached_jobs), locks taken
# with the kernel's flock, macOS having no `flock` command (home_folder_more), `wc`'s padded count (finish_commit), a temp
# folder whose path is a link (warm_start: /var is /private/var), a copied program that may need signing again
# (take_over_more), and a machine name too long to show whole (the runners' own: coordinator_levels,
# board_coordinators_inks). The whole check passed there once too, on the commit that brought these.
# The board's own whole check is this run, waited for whole by scripts/check-cloud.sh: a failure of one of the steps that
# run the check (its own_steps: rename one here, rename it there) goes back to the task with its job's and step's names;
# any other step that fails is GitHub's, and the task waits for you (docs/check-on-github.md).
name: Check

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Cache the build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: check-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: check-${{ runner.os }}-

      - name: The check
        env:
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@example.com
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@example.com
        run: npm run check -- --all

      # The check writes the made tables (docs/keys.md, docs/settings.md, docs/agents.md); what it wrote here is not sent
      # back. A table out of date in the commit fails, with its name, for the task to write and commit it itself.
      - name: The made tables are committed
        run: |
          changed=$(git diff --name-only)
          if [ -n "$changed" ]; then
            echo "::error::The check wrote files that differ from the commit: $(echo $changed)"
            echo "These files in git are out of date in the commit:"; echo "$changed" | sed 's/^/  /'
            echo "Run npm run check (or ./target/quick/herdr-projects docs) in your worktree and commit what it wrote."
            exit 1
          fi

  macos:
    # shortcut: Intel, because the arm64 runners are too few: since 2026-11-02 a job there often gets none and GitHub
    # cancels it after 15 minutes, with no step run. Back to macos-15 when they are enough again; arm64 goes untested here.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Cache the build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: macos-${{ runner.arch }}-

      - name: The areas that differ on macOS
        env:
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@example.com
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@example.com
        run: npm run check plan-sandbox plan-steps detached-jobs home-folder-more finish-commit warm-start take-over-more coordinator-levels board-coordinators-inks
